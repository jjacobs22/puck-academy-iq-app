<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in... - Puck Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ice-blue: #E8F4F8;
            --dark-blue: #0A1628;
            --accent-red: #C8102E;
            --ice-white: #FFFFFF;
            --silver: #A8B2BE;
            --success-green: #2D7A3E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, var(--dark-blue) 0%, #1a2940 100%);
            color: var(--ice-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 2rem;
        }

        .logo span { color: var(--accent-red); }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .substatus {
            color: var(--silver);
            font-size: 0.9rem;
        }

        .error-state {
            display: none;
        }

        .error-state.active {
            display: block;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .error-message {
            color: #ef4444;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
            background: var(--accent-red);
            color: white;
        }

        .btn:hover {
            background: #a50d26;
            transform: translateY(-2px);
        }

        .loading-state.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Puck <span>Academy</span></h1>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p class="status">Signing you in...</p>
            <p class="substatus">Just a moment while we set up your account.</p>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState">
            <div class="error-icon">⚠️</div>
            <p class="status">Something went wrong</p>
            <p class="error-message" id="errorMessage">We couldn't complete the sign in.</p>
            <a href="/training.html" class="btn">Back to Training</a>
        </div>
    </div>

    <script type="module">
        import { supabase, syncProgressToServer, loadProgressFromServer, updateProfile } from '../js/supabase.js';

        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');

        function showError(message) {
            loadingState.classList.add('hidden');
            errorState.classList.add('active');
            errorMessage.textContent = message;
        }

        async function handleCallback() {
            try {
                // Wait for auth state to settle
                const { data: { session }, error } = await supabase.auth.getSession();

                if (error) {
                    showError(error.message);
                    return;
                }

                if (!session) {
                    // No session yet, wait for auth state change
                    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session) {
                            subscription.unsubscribe();
                            await completeSignIn(session);
                        }
                    });

                    // Timeout after 10 seconds
                    setTimeout(() => {
                        showError('Sign in timed out. Please try again.');
                    }, 10000);
                } else {
                    await completeSignIn(session);
                }
            } catch (err) {
                console.error('Callback error:', err);
                showError('An unexpected error occurred. Please try again.');
            }
        }

        async function completeSignIn(session) {
            try {
                const user = session.user;
                console.log('Signed in as:', user.email);

                // Update profile with any localStorage data
                const localUserData = localStorage.getItem('puckAcademy_userData');
                if (localUserData) {
                    const userData = JSON.parse(localUserData);
                    await updateProfile({
                        position: userData.position,
                        age_level: userData.level,
                        goals: userData.improvements
                    });
                }

                // Sync progress: first load from server, then merge local
                await loadProgressFromServer();
                await syncProgressToServer();

                // Mark migration complete
                localStorage.setItem('puckAcademy_migrated', 'true');

                // Redirect to training
                window.location.href = '/training.html?welcome=true';
            } catch (err) {
                console.error('Complete sign in error:', err);
                // Still redirect even if sync fails
                window.location.href = '/training.html';
            }
        }

        // Start the callback handling
        handleCallback();
    </script>
</body>
</html>
