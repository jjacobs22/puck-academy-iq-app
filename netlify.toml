# Netlify configuration — SvelteKit SPA deployment

[build]
  command = "cd puck-academy-spa && rm -rf static/audio && cp -r ../audio static/audio && npm install && npm run build"
  publish = "puck-academy-spa/build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Install function dependencies from netlify/functions/package.json
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# SPA fallback — redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled function: Streak reminder emails
# Runs daily at 10am ET (3pm UTC) to catch users before end of day
[functions."streak-reminder"]
  schedule = "0 15 * * *"

# Scheduled function: Day 2 Nudge emails
# Runs daily at 6pm ET (11pm UTC) to catch users who signed up yesterday but haven't returned
[functions."day2-nudge"]
  schedule = "0 23 * * *"

# Scheduled function: Win-back emails
# Runs daily at 1pm ET (6pm UTC) to re-engage users inactive for 7 days
[functions."winback"]
  schedule = "0 18 * * *"
