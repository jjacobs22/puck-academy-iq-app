<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0A1628"/>
  
  <!-- Hockey stick -->
  <path d="M 150 100 L 150 350 Q 150 380 180 380 L 350 380" 
        fill="none" 
        stroke="#C8102E" 
        stroke-width="35" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Puck -->
  <ellipse cx="320" cy="300" rx="60" ry="25" fill="#1a1a1a"/>
  <ellipse cx="320" cy="290" rx="60" ry="25" fill="#333"/>
  
  <!-- Text: PA -->
  <text x="256" y="200" 
        font-family="Arial Black, sans-serif" 
        font-size="120" 
        font-weight="bold"
        fill="#E8F4F8" 
        text-anchor="middle">PA</text>
</svg>
